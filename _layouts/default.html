<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
  {%- include head.html -%}
  <body class="layout-{{ page.layout | default: 'default' }}">

    {%- include eeg.html variant="paper" class="eeg--fixed" -%}

    {%- include header.html -%}

    <main class="page" id="content" aria-label="Content">
      {{ content }}
    </main>

    {%- include footer.html -%}

    <script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
  </body>
</html>
