# ---- Homepage hero -------------------------------------------------------
# `statement` is rendered as the large display headline. The <em> spans are
# coloured automatically (alternating cool / warm accent).
hero:
  eyebrow: "Developmental Computational Cognitive Neuroscience"
  statement: >-
    How the human brain learns from its environment:
    from <em>birth</em> to <em>adulthood</em>
  lede: >-
    From auditory sequences in sleeping newborns to perceptual decisions in
    adults, measured with EEG, MEG and intracranial recordings, explained
    with Bayesian and neural-network models.

