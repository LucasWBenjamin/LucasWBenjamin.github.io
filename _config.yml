title: Lucas Benjamin
tagline: Postdoctoral Researcher · Computational Cognitive Neuroscience
description: >-
  Lucas Benjamin, postdoctoral researcher in computational cognitive
  neuroscience at Aix-Marseille University (INS) and ENS-PSL (LNC2).
  Studying how the human brain learns from its environment, from birth to
  adulthood, using EEG, MEG, intracranial recordings and computational models.
author: Lucas Benjamin
