<header class="site-header">
  <div class="wrapper site-header__inner">
    <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
    <nav class="site-nav" aria-label="Main">
      {%- for item in site.nav -%}
        {%- assign current = false -%}
        {%- if page.url == item.url -%}{%- assign current = true -%}{%- endif -%}
        {%- if item.url != "/" and page.url contains item.url -%}{%- assign current = true -%}{%- endif -%}
        <a href="{{ item.url | relative_url }}"{% if current %} aria-current="page"{% endif %}>{{ item.title }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
